spring.datasource.url=jdbc:postgresql://localhost:5432/maindb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/public/login/oauth2/code/{registrationId}

# Real value comes from .env (see .env.example) - never a literal secret in this committed file.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-minutes=15
app.refresh-token.ttl-days=30
app.refresh-token.revoked-retention-days=30

app.frontend-post-login-url=http://localhost:5173/dashboard
app.frontend-login-url=http://localhost:5173/