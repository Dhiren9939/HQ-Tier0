spring.application.name=api
server.port=8081
spring.threads.virtual.enabled=true

spring.jpa.hibernate.ddl-auto=none

# Mounted under /api/v1/public so the SecurityConfig permitAll rule for that prefix covers the
# docs UI and JSON without needing a separate, easy-to-forget security exception.
springdoc.api-docs.path=/api/v1/public/v3/api-docs
springdoc.swagger-ui.path=/api/v1/public/swagger-ui.html

spring.profiles.active=dev
