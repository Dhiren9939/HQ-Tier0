spring.application.name=api
server.port=8081

spring.profiles.active=dev

# Mounted under /api/public so the SecurityConfig permitAll rule for that prefix covers the
# docs UI and JSON without needing a separate, easy-to-forget security exception.
springdoc.api-docs.path=/api/public/v3/api-docs
springdoc.swagger-ui.path=/api/public/swagger-ui.html
