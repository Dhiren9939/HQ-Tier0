# Request validation. The key is the machine-readable code a client sees in errors[].code;
# the text is the human-readable message next to it. Used as @Constraint(message = "{KEY}").
NAME_REQUIRED=must not be blank
NAME_BLANK=must not be blank
NAME_TOO_LONG=must be at most {max} characters
NAME_INVALID_CHARACTERS=must not contain control characters
EXPIRY_REQUIRED=is required
PERMISSION_SCOPE_REQUIRED=a permission scope must not be null
PERMISSION_LEVEL_REQUIRED=a permission level must not be null
ISSUER_REQUIRED=must not be blank
ISSUER_TOO_LONG=must be at most {max} characters
ISSUER_INVALID_FORMAT=must start with a letter or digit and contain only letters, digits and . _ : / -
