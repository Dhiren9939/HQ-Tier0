spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.jakarta.persistence.create-database-schemas=true

# Key format used for newly issued API keys (older formats keep verifying)
access.key-format.current=V1

# RabbitMQ (docker-compose service "rabbitmq"); the stream protocol is on 5552
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.stream.host=localhost
spring.rabbitmq.stream.port=5552
