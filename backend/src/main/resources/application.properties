spring.application.name=backend

# Console logs stay human-readable, with the structured key-value fields (event=..., accessId=...) at the end
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(--- [%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%clr( %kvp){faint}%n%wEx

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# No session held open for the whole web request: lazy loading only works inside a transaction
spring.jpa.open-in-view=false

# Everything is UTC: Hibernate binds and reads timestamps in UTC, Jackson writes dates in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

spring.jpa.properties.jakarta.persistence.create-database-schemas=true

# RabbitMQ (docker-compose service "rabbitmq"); the stream protocol is on 5552
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.stream.host=localhost
spring.rabbitmq.stream.port=5552

# Key format used for newly issued API keys (older formats keep verifying)
access.key-format.current=V1

# Outbox relay: publishes access.outbox to the super stream every poll-interval and halts on a row it cannot publish
access.outbox.relay.enabled=true
access.outbox.relay.stream-name=apikey.projections
access.outbox.relay.partitions=2
access.outbox.relay.batch-size=100
access.outbox.relay.poll-interval=PT2S
access.outbox.relay.confirm-timeout=PT5S
